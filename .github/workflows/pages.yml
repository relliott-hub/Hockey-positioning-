name: Deploy to GitHub Pages

# Manual only. The repo's Pages source is "Deploy from a branch" (main, root),
# so GitHub's built-in "pages build and deployment" already publishes every
# push to main. This workflow ran alongside it on each push, raced it, and
# intermittently failed ("No artifacts named github-pages"), sending failure
# emails for deploys that had in fact succeeded. Kept for a manual re-publish
# from the Actions tab if the Pages source is ever switched to GitHub Actions.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # The game is plain static files at the repo root — no build step needed.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
